<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', sans-serif; background: #f7f6f3; height: 100vh; display: flex; flex-direction: column; color: #333; }
  #header { padding: 10px 14px; font-size: 13px; font-weight: 600; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 6px; }
  #header .dot { width: 10px; height: 10px; border-radius: 50%; background: #e8a04c; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 86%; padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.7; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #e8a04c; color: #fff; border-bottom-right-radius: 3px; }
  .msg.ai { align-self: flex-start; background: #fff; border: 1px solid #eee; border-bottom-left-radius: 3px; }
  .msg.ai.typing::after { content: '▍'; animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .error { color: #d33; font-size: 12px; align-self: center; }
  /* Markdown 样式 */
  .msg.ai h1,.msg.ai h2,.msg.ai h3,.msg.ai h4 { margin: 8px 0 4px; font-size: 15px; line-height: 1.4; }
  .msg.ai h1 { font-size: 16px; } .msg.ai h2 { font-size: 15px; } .msg.ai h3,.msg.ai h4 { font-size: 14px; }
  .msg.ai p { margin: 4px 0; }
  .msg.ai ul,.msg.ai ol { margin: 4px 0 4px 18px; padding: 0; }
  .msg.ai li { margin: 2px 0; }
  .msg.ai code { background: #f4f1ea; border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: #c0392b; }
  .msg.ai pre { background: #2b2b2b; color: #e8e8e8; border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 6px 0; font-size: 12px; line-height: 1.5; }
  .msg.ai pre code { background: none; color: inherit; padding: 0; }
  .msg.ai blockquote { border-left: 3px solid #e8a04c; margin: 6px 0; padding: 2px 10px; color: #666; background: #faf7f0; border-radius: 0 6px 6px 0; }
  .msg.ai table { border-collapse: collapse; margin: 6px 0; font-size: 12px; width: 100%; }
  .msg.ai th,.msg.ai td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
  .msg.ai th { background: #f4f1ea; }
  .msg.ai a { color: #b07a2a; }
  .msg.ai hr { border: none; border-top: 1px solid #eee; margin: 8px 0; }
  #input-row { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #eee; }
  #input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 18px; font-size: 13px; outline: none; }
  #input:focus { border-color: #e8a04c; }
  #send { padding: 8px 16px; border: none; border-radius: 18px; background: #e8a04c; color: #fff; font-size: 13px; cursor: pointer; }
  #send:disabled { opacity: 0.6; }
</style>
</head>
<body>
  <div id="header"><span class="dot"></span><span id="headerTitle">自习室</span></div>
  <div id="messages"></div>
  <div id="input-row">
    <input id="input" placeholder="查询任何信息…" autocomplete="off" />
    <button id="send">发送</button>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  window.pet.petNameGet().then((n) => { document.getElementById('headerTitle').textContent = n + '自习室'; });
  const messages = $('messages');
  const input = $('input');
  const sendBtn = $('send');
  let busy = false;
  let aiBubble = null;
  let aiFullText = '';

  // ---------- 轻量 Markdown 渲染（先转义防 XSS，再解析常见语法） ----------
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function renderInline(s) {
    s = escapeHtml(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    return s;
  }
  function renderTable(lines) {
    const rows = lines.map((l) =>
      l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim())
    );
    let html = '<table><thead><tr>';
    for (const cell of rows[0]) html += '<th>' + renderInline(cell) + '</th>';
    html += '</tr></thead><tbody>';
    for (let i = 2; i < rows.length; i++) {
      html += '<tr>';
      for (const cell of rows[i]) html += '<td>' + renderInline(cell) + '</td>';
      html += '</tr>';
    }
    return html + '</tbody></table>';
  }
  function renderMarkdown(text) {
    const lines = text.split('\n');
    let html = '';
    let inCode = false;
    let codeBuf = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const t = line.trim();
      if (t.startsWith('```')) {
        if (!inCode) { inCode = true; codeBuf = []; }
        else { inCode = false; html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'; }
        i++;
        continue;
      }
      if (inCode) { codeBuf.push(line); i++; continue; }
      if (t.startsWith('|')) {
        const tableLines = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) { tableLines.push(lines[i]); i++; }
        if (tableLines.length >= 2) html += renderTable(tableLines);
        continue;
      }
      const h = t.match(/^(#{1,4})\s+(.*)/);
      if (h) { html += '<h' + h[1].length + '>' + renderInline(h[2]) + '</h' + h[1].length + '>'; i++; continue; }
      if (t.startsWith('>')) { html += '<blockquote>' + renderInline(t.replace(/^>\s?/, '')) + '</blockquote>'; i++; continue; }
      if (/^(-{3,}|\*{3,})$/.test(t)) { html += '<hr/>'; i++; continue; }
      if (/^[-*+]\s+/.test(t)) {
        let listHtml = '<ul>';
        while (i < lines.length && /^[-*+]\s+/.test(lines[i].trim())) {
          listHtml += '<li>' + renderInline(lines[i].trim().replace(/^[-*+]\s+/, '')) + '</li>';
          i++;
        }
        html += listHtml + '</ul>';
        continue;
      }
      if (/^\d+\.\s+/.test(t)) {
        let listHtml = '<ol>';
        while (i < lines.length && /^\d+\.\s+/.test(lines[i].trim())) {
          listHtml += '<li>' + renderInline(lines[i].trim().replace(/^\d+\.\s+/, '')) + '</li>';
          i++;
        }
        html += listHtml + '</ol>';
        continue;
      }
      if (!t) { i++; continue; }
      html += '<p>' + renderInline(line) + '</p>';
      i++;
    }
    if (inCode && codeBuf.length) html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>';
    return html;
  }

  function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    if (cls.includes('user') || cls.includes('error')) {
      div.textContent = text;
    } else {
      div.innerHTML = renderMarkdown(text);
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = '';
    addMsg(text, 'user');
    busy = true;
    sendBtn.disabled = true;
    aiBubble = addMsg('🔍 正在查询实时信息…', 'ai typing');

    const res = await window.pet.aiChat(text, 'assistant');
    if (!res.ok) {
      aiBubble.classList.remove('typing');
      aiBubble.textContent = '⚠️ ' + (res.error || '发送失败');
      aiBubble.classList.add('error');
      busy = false;
      sendBtn.disabled = false;
      return;
    }
  }

  // 流式追加（Markdown 实时渲染）
  let firstChunk = true;
  window.pet.onAiChunk((chunk) => {
    if (!aiBubble) return;
    if (chunk.done) {
      aiBubble.classList.remove('typing');
      busy = false;
      sendBtn.disabled = false;
      aiBubble = null;
      aiFullText = '';
      firstChunk = true;
      messages.scrollTop = messages.scrollHeight;
    } else {
      if (firstChunk) {
        aiFullText = '';
        firstChunk = false;
      }
      aiFullText += chunk.text;
      aiBubble.innerHTML = renderMarkdown(aiFullText);
      messages.scrollTop = messages.scrollHeight;
    }
  });

  sendBtn.addEventListener('click', () => send());
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  input.focus();
</script>
</body>
</html>
